# yaml-language-server: $schema=https://raw.githubusercontent.com/mlavrinenko/outdatty/main/schema/outdatty.schema.json

# Declares which dependents must be re-confirmed when a source changes. After
# editing a source, review the dependents and run `just outdatty-update` to
# record the new state; `just outdatty-check` (part of `just check`) fails until
# you do. Tune these groups to match where your project's coupled files live.
groups:
  # The public surface (CLI for a bin, the library API for a lib) is
  # documented by hand. Touching the code flags the user-facing docs as
  # needing a look. src/main.rs only exists for crate_kind == "bin".
  - name: {% if crate_kind == "bin" %}cli-docs{% else %}api-docs{% endif %}
    source:
      - src/lib.rs
{%- if crate_kind == "bin" %}
      - src/main.rs
{%- endif %}
    dependents:
      - README.md
      - www/index.html

  # A package change (version, dependencies, metadata) should land in the
  # changelog.
  - name: release-notes
    source:
      - Cargo.toml
    dependents:
      - CHANGELOG.md

  # The dev tooling and conventions documented for contributors track the
  # files that define them.
  - name: dev-docs
    source:
      - flake.nix
      - Justfile
    dependents:
      - CONTRIBUTING.md
      - AGENTS.md
