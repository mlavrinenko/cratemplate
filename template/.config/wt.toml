# Worktrunk (`wt`) project hooks: everything a fresh clone needs to fork work
# and land it, so no user-level hook has to exist. `just fork` and `just land`
# run the commands that set the merge defaults, which project config cannot.
# Hooks run through `direnv exec .` because the dev shell, not the user profile,
# holds `just` and `mmz`. Docs: https://worktrunk.dev/hook/

# A new worktree gets its `.envrc` allowed, so its dev shell loads.
[[pre-start]]
allow = "direnv allow"

# The lock first: the rebase left the target's outdatty.lock (see
# .gitattributes), so `refresh` records the merged tree before the gate reads
# it, and `amend` folds the result into the lane's last commit once the gate
# has passed on it. Both are no-ops when the lock merged on its own.
[[pre-merge]]
lock = "direnv exec . bash .just/scripts/wt-lock.sh refresh {{ target }}"

# The gate, then the task check. `just check` is memoized by mmz, so a gate that
# already passed is a no-op. The task check is a no-op in a crate without
# MindTape (see the script).
[[pre-merge]]
gate = "direnv exec . just check"

[[pre-merge]]
amend = "direnv exec . bash .just/scripts/wt-lock.sh amend {{ target }}"

[[pre-merge]]
tasks = "direnv exec . bash .just/scripts/wt-tasks.sh {{ target }}..HEAD"

# Runs inside the worktree being removed, so the gate records step into the
# primary checkout and import from here (`mmz --import` refuses its own
# checkout). A copied record is still judged against the primary's tree, so a
# branch that did not land cannot make a gate read fresh there. The lcov carry
# is gated on a landed merge by its script. Neither may fail the merge, which
# has already landed. An mmz without `--import` makes the first a logged no-op.
[[pre-remove]]
records = "cd {{ primary_worktree_path }} && direnv exec . mmz --import {{ worktree_path }} || true"
lcov = "direnv exec . bash .just/scripts/wt-carry-lcov.sh {{ primary_worktree_path }} || true"
