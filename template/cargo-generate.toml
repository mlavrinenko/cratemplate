[template]
# 0.16.0 is the first release that validates `--define` values against a
# placeholder's `regex` (cargo-generate#692); older releases would let an
# unsafe description through.
cargo_generate_version = ">=0.16.0"
exclude = ["Justfile", "release.toml", ".config/wt.toml", "rust-toolchain.toml", "clippy.toml", "rustfmt.toml", ".envrc", ".gitignore", ".linecop.yaml", ".config/nextest.toml", ".mmz/config.yaml", ".mmz/.gitignore", ".github/workflows/ci.yml", ".github/workflows/pages.yml", ".github/workflows/release.yml", ".github/workflows/release-lib.yml"]
# outdatty.yaml is NOT in this list: its cli-docs group source list is
# crate_kind-aware (src/main.rs only exists for bin), so it needs Liquid
# rendering. It contains no GitHub `${{ }}` expressions, so this is safe —
# unlike the workflow files above, which must stay excluded.
# docs/src/**/*.typ and the Markdown it generates (AGENTS.md, and later
# README.md/CONTRIBUTING.md) are deliberately NOT excluded either: the Liquid
# pass must render the same `{{project-name}}` placeholder in the source and in
# the committed output, so a generated project's docs-md-check compares like
# against like instead of diffing a placeholder against a real name.
# flake.lock is deliberately NOT ignored: generated projects inherit the
# template's validated pins (qahq, nixpkgs, …). A project bumps them with
# `nix flake update` on its own schedule; without the lock every generated
# project would free-resolve upstream HEAD on its first nix develop and the
# validated toolchain combo would rot at birth.
# `.mmz/cache` is mmz's local memoization store: never copy it into a project.
ignore = [".direnv", ".mmz/cache"]

[placeholders.gh-username]
type = "string"
prompt = "GitHub username or org?"

[placeholders.description]
type = "string"
prompt = "Project description?"
default = "A Rust project"
# The answer lands verbatim in Cargo.toml's basic string, the `///` doc
# comment in src/main.rs, README.md and www/index.html. A double quote or
# backslash would break the TOML string (or start an escape), and a line
# break would break the doc comment, so reject every character a TOML basic
# string cannot hold: quote, backslash, CR/LF, the other C0 controls and DEL
# (tab stays legal). cargo-generate refuses the value before writing a file.
regex = '\A[^"\\\x00-\x08\x0A-\x1F\x7F]*\z'

[placeholders.license]
type = "string"
prompt = "License?"
# SPDX identifiers, verbatim: the value lands in Cargo.toml's `license` field,
# which crates.io and `cargo deny check licenses` both parse as SPDX. Plain
# "GPL-3.0" is deprecated in SPDX and warns; "GPL-3.0-only" is its replacement
# (shipping the v3 text with no "or later" clause).
choices = ["MIT", "Apache-2.0", "MIT OR Apache-2.0", "GPL-3.0-only"]
default = "MIT"

# NOTE: underscore, not hyphen. cargo-generate's `[conditional]` expressions
# are parsed by evalexpr, which reads a bare `-` as subtraction — a hyphenated
# placeholder name silently fails to match in `[conditional.'...']` sections
# (no error, the branch is just never taken) while still working fine inside
# `{{ }}`/`{% %}` Liquid substitution in file content. Verified empirically
# against cargo-generate 0.23.9; keep this placeholder underscored.
[placeholders.crate_kind]
type = "string"
prompt = "Crate kind?"
choices = ["lib", "bin"]
default = "bin"

# Task tracking is optional. `mindtape` ships the minimal `.mindtape/` config,
# its task template and the `tasks/` root; `none` ships neither. The underscore
# follows the same `[conditional]` rule as `crate_kind` above.
[placeholders.task_tracker]
type = "string"
prompt = "Task tracker?"
choices = ["none", "mindtape"]
default = "none"

# Conditional license file inclusion
[conditional.'license == "MIT"']
ignore = ["LICENSE-APACHE", "LICENSE-GPL"]

[conditional.'license == "Apache-2.0"']
ignore = ["LICENSE-MIT", "LICENSE-GPL"]

[conditional.'license == "MIT OR Apache-2.0"']
ignore = ["LICENSE-GPL"]

[conditional.'license == "GPL-3.0-only"']
ignore = ["LICENSE-MIT", "LICENSE-APACHE"]

# Conditional crate-kind file inclusion: a lib has no binary entry point or CLI
# integration tests, and ships the lib-only release workflow (guard + check +
# publish, no build matrix). A bin keeps main.rs, tests/it/main.rs, tests/it/cli.rs
# and the existing cross-platform build + release workflow.
[conditional.'crate_kind == "lib"']
ignore = ["src/main.rs", "tests/it/cli.rs", "tests/it/main.rs", ".github/workflows/release.yml"]

[conditional.'crate_kind == "bin"']
ignore = [".github/workflows/release-lib.yml"]

# `ignore` takes files and folders, not globs: drop the tracker's config and
# its task root wholesale, leaving no empty `tasks/` behind.
[conditional.'task_tracker != "mindtape"']
ignore = [".mindtape", "tasks"]
