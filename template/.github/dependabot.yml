version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Cargo.toml (and Cargo.lock when present): one grouped PR per monthly run.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      cargo:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: "scope"
